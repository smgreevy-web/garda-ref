<body>
<div id="boot" aria-hidden="true">
<style>
#boot{position:fixed;inset:0;z-index:99999;background:#06060C;color:#e9dcb0;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;transition:opacity .45s ease,transform .45s ease}
#boot.out{opacity:0;transform:scale(1.04);pointer-events:none}
#boot::before{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(212,175,55,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(212,175,55,.06) 1px,transparent 1px);background-size:30px 30px;-webkit-mask-image:radial-gradient(circle at 50% 42%,#000,transparent 72%);mask-image:radial-gradient(circle at 50% 42%,#000,transparent 72%)}
#boot::after{content:'';position:absolute;left:0;right:0;height:120px;top:-120px;background:linear-gradient(180deg,transparent,rgba(212,175,55,.07),transparent);animation:bscan 2.4s linear infinite}
@keyframes bscan{to{top:100%}}
#boot .bk-top{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:16px;right:16px;display:flex;justify-content:space-between;font:600 11px/1 ui-monospace,Menlo,monospace;letter-spacing:1.5px;color:#8a7a45}
#boot .bk-top b{color:#D4AF37;font-weight:700}
#boot .bk-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;background:#3fe07a;box-shadow:0 0 8px #3fe07a;vertical-align:1px}
#boot .bk-dot.off{background:#e0a33f;box-shadow:0 0 8px #e0a33f}
#boot .bk-ring{position:relative;width:148px;height:148px;display:flex;align-items:center;justify-content:center}
#boot .bk-ring i{position:absolute;inset:0;border-radius:50%;border:2px solid transparent;border-top-color:#D4AF37;border-right-color:rgba(212,175,55,.35);animation:bspin 1.1s linear infinite}
#boot .bk-ring i+i{inset:10px;border-top-color:transparent;border-right-color:transparent;border-bottom-color:rgba(212,175,55,.8);border-left-color:rgba(212,175,55,.25);animation:bspin 1.6s linear infinite reverse}
#boot .bk-ring img{width:62px;height:auto;filter:drop-shadow(0 0 14px rgba(212,175,55,.35));animation:bpulse 1.6s ease-in-out infinite}
@keyframes bspin{to{transform:rotate(360deg)}}
@keyframes bpulse{50%{transform:scale(1.05)}}
#boot h1{margin:22px 0 4px;font:800 23px/1.1 system-ui,-apple-system,Roboto,sans-serif;letter-spacing:6px;text-indent:6px;background:linear-gradient(180deg,#f3e3a6,#D4AF37 60%,#9a7f2a);-webkit-background-clip:text;background-clip:text;color:transparent}
#boot .bk-sub{font:600 10.5px/1.4 ui-monospace,Menlo,monospace;letter-spacing:2.5px;color:#8a7a45;text-align:center}
#boot .bk-log{margin-top:20px;width:min(300px,82vw);min-height:104px;font:600 11px/1.6 ui-monospace,Menlo,monospace;color:#b9a970;letter-spacing:.4px}
#boot .bk-log div{white-space:nowrap;overflow:hidden;opacity:0;animation:bline .22s ease forwards}
#boot .bk-log div span{float:right;color:#3fe07a}
#boot .bk-log div.rdy{color:#D4AF37;font-weight:800;letter-spacing:2px}
@keyframes bline{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
#boot .bk-bar{margin-top:14px;width:min(300px,82vw);height:2px;background:rgba(212,175,55,.15);border-radius:2px;overflow:hidden}
#boot .bk-bar b{display:block;height:100%;width:0;background:linear-gradient(90deg,#9a7f2a,#D4AF37,#f3e3a6);box-shadow:0 0 10px #D4AF37;transition:width 1.9s cubic-bezier(.3,.7,.3,1)}
#boot .bk-foot{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom,0px));font:600 10px/1 ui-monospace,Menlo,monospace;letter-spacing:2px;color:#5d5230}
@media (prefers-reduced-motion:reduce){#boot::after,#boot .bk-ring i,#boot .bk-ring img{animation:none}}
</style>
<div class="bk-top"><span>ZULU <b id="bkZ">--:--:--Z</b></span><span><i class="bk-dot" id="bkDot"></i><b id="bkNet">ONLINE</b></span></div>
<div class="bk-ring"><i></i><i></i><img src="icons/officer.png" alt=""></div>
<h1>GARDA REFERENCE</h1>
<div class="bk-sub">OPERATIONAL INTELLIGENCE<br>MOUNTJOY · DMR NORTH CENTRAL</div>
<div class="bk-log" id="bkLog"></div>
<div class="bk-bar"><b id="bkBar"></b></div>
<div class="bk-foot">v46 · TAP TO SKIP</div>
<script>
(function(){
  var b=document.getElementById('boot'); if(!b)return;
  var seen=false; try{seen=sessionStorage.getItem('gr_boot')==='1';sessionStorage.setItem('gr_boot','1');}catch(e){}
  var quick=seen||(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
  var done=false; function end(){ if(done)return; done=true; b.classList.add('out'); setTimeout(function(){ if(b.parentNode)b.parentNode.removeChild(b); },480); }
  if(quick){ setTimeout(end,seen?60:500); return; }
  b.addEventListener('click',end);
  var on=navigator.onLine!==false;
  document.getElementById('bkNet').textContent=on?'ONLINE':'OFFLINE';
  if(!on)document.getElementById('bkDot').className='bk-dot off';
  var z=document.getElementById('bkZ'); function tick(){ z.textContent=new Date().toISOString().substr(11,8)+'Z'; } tick(); var zt=setInterval(tick,1000);
  var lines=[[on?'ESTABLISHING SECURE LINK':'OFFLINE MODE · LOCAL CACHE','OK'],['LOADING 12 VOLUMES + MANUAL','OK'],['INDEXING 397 CASES','OK'],['CAMERA GRID · 138 FEEDS','OK'],['DISTRICTS · STATIONS · DCC 241','OK'],['SYSTEM READY','']];
  var log=document.getElementById('bkLog');
  lines.forEach(function(l,i){ setTimeout(function(){ var d=document.createElement('div'); if(!l[1])d.className='rdy';
      d.innerHTML='› '+l[0]+(l[1]?'<span>'+l[1]+'</span>':''); log.appendChild(d); },170+i*290); });
  requestAnimationFrame(function(){ document.getElementById('bkBar').style.width='100%'; });
  setTimeout(function(){ clearInterval(zt); end(); },2250);
})();
</script>
</div>
