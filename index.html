<script>/* theme before first paint (ivory is the default) — keep in step with THEMES in app.js */
(function(){var t='ivory',c={ivory:'#f3f0e9',daylight:'#f2f3f5',sepia:'#eee4d1',mist:'#eef1f5',slate:'#121519',graphite:'#0f1111',navy:'#0c1320',forest:'#0f1411',midnight:'#000000'},L={ivory:1,daylight:1,sepia:1,mist:1};
try{var s=localStorage.getItem('gr_theme');if(s&&c[s])t=s;}catch(e){}
var d=document.documentElement;d.setAttribute('data-theme',t);d.setAttribute('data-tone',L[t]?'light':'dark');var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content',c[t]);})();
/* deep links (?open=… and #…) are read once from here, then taken out of the address so Back or a reload can't run them again */
(function(){try{var s=location.search,h=location.hash;window.__entry={search:s,hash:h};if(s||h)history.replaceState(null,'',location.pathname);}catch(e){window.__entry={search:'',hash:''};}})();
/* app lock: nothing shows until the password is entered (lock.js decides) */
(function(){try{if(localStorage.getItem('gr_lock'))document.documentElement.classList.add('locked');}catch(e){}})();</script>
